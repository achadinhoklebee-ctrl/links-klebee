<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="logo.png"><title>Achadinho Klebee – links dos produtos</title>
<style>
:root{--bg:#0B1230;--card:#fff;--ac:#EE4D2D;--tx:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:#fff}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
img.logo{display:block;width:120px;height:120px;border-radius:50%;margin:6px auto 10px;box-shadow:0 0 0 3px #EE4D2D,0 4px 14px #0008}h1{font-size:20px;text-align:center;margin:8px 0 4px}p.sub{text-align:center;margin:0 0 18px;opacity:.8;font-size:14px}
a.item{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--tx);text-decoration:none;border-radius:14px;padding:14px 16px;margin:10px 0;font-weight:700;box-shadow:0 2px 8px #0005}
a.item b{background:var(--ac);color:#fff;border-radius:50%;min-width:32px;height:32px;display:grid;place-items:center}
a.item span{flex:1}a.item i{font-style:normal;color:var(--ac)}
h2{font-size:15px;margin:26px 0 6px;opacity:.9}
a.mais{display:block;text-align:center;color:#fff;opacity:.75;margin:22px 0 0;font-size:14px;text-decoration:underline}#vazio{text-align:center;opacity:.8}
</style></head><body><main>
<img class="logo" src="logo.png" alt="Achadinho Klebee"><h1>Achadinho Klebee</h1><p class="sub">Toque no produto para abrir na Shopee</p>
<div id="lista"></div><div id="vazio" hidden>Em breve os links aparecem aqui.</div>
<script>
fetch('data/achadinhos.json?'+Date.now()).then(r=>r.json()).then(d=>{
  const P=new URLSearchParams(location.search),q=P.get('a'),todos=P.has('todos');
  const L=d.achadinhos||[],el=document.getElementById('lista');
  if(!L.length){document.getElementById('vazio').hidden=false;return}
  const itens=a=>a.itens.forEach((it,i)=>{const x=document.createElement('a');x.className='item';x.href=it.link;x.rel='noopener';
    x.innerHTML='<b>'+(i+1)+'</b><span></span><i>Ver ▸</i>';x.querySelector('span').textContent=it.nome;el.append(x)});
  if(todos){const h=document.createElement('h2');h.textContent='Todos os achadinhos';el.append(h);
    L.forEach((a,n)=>{const x=document.createElement('a');x.className='item';x.href='?a='+encodeURIComponent(a.id);
      x.innerHTML='<b>'+(L.length-n)+'</b><span></span><i>Abrir ▸</i>';x.querySelector('span').textContent=a.titulo+' – '+a.itens.slice(0,2).map(i=>i.nome).join(', ')+'…';el.append(x)});return}
  const sel=(q&&L.find(x=>x.id===q))||L[0];itens(sel);
  if(L.length>1){const m=document.createElement('a');m.className='mais';m.href='?todos';m.textContent='Ver outros achadinhos';el.append(m)}
}).catch(()=>{document.getElementById('vazio').hidden=false});
</script></main></body></html>
